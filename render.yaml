services:
  - type: web
    name: phishshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENABLE_LLM_EXPLANATIONS
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: STORE_SCAN_CONTENT
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: IP_HASH_SALT
        generateValue: true
