<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishShield Warning</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="warning-shell">
      <section class="panel">
        <p class="eyebrow">PHISHSHIELD LINK GUARD</p>
        <h1>Hold on — this link looks risky.</h1>
        <p class="subtitle">PhishShield paused navigation before opening this address. No content from the destination was fetched.</p>
        <div id="target-url" class="url-box"></div>
        <div class="badge-row">
          <span id="verdict" class="verdict">Checking…</span>
          <span id="scan-ref" class="ref"></span>
        </div>
        <div class="meter-track" aria-hidden="true">
          <div id="meter-fill" class="meter-fill" style="width: 4%"></div>
        </div>
        <div id="campaign-badge" class="campaign" hidden>Repeated scam/campaign pattern detected</div>
        <p id="explanation" class="explanation"></p>
        <ul id="reasons"></ul>
        <p id="ml-signal" class="ml-signal" hidden></p>
        <div class="actions">
          <button id="back-btn" class="btn-primary" type="button">← Go back to safety</button>
          <select id="language" aria-label="Explanation language" style="width:auto">
            <option value="en">English</option>
            <option value="hi">Hindi (हिन्दी)</option>
          </select>
          <button id="proceed-btn" class="btn-danger" type="button">I understand the risk, open anyway</button>
        </div>
        <footer>PhishShield analyzes links locally as text before opening them.</footer>
      </section>
    </main>
    <script src="scanner.js"></script>
    <script src="warning.js"></script>
  </body>
</html>
